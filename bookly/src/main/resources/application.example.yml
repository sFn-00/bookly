spring:
  application:
    name: bookly
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookly}
    username: ${DB_USERNAME:bookly}
    password: ${DB_PASSWORD:bookly}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:your_mailtrap_username}
    password: ${MAIL_PASSWORD:your_mailtrap_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  mail:
    from: ${MAIL_FROM:noreply@bookly.pl}
  jwt:
    secret: ${JWT_SECRET:your_jwt_secret_min_256_bits}
    access-token-expiration: 900000      # 15 minutes
    refresh-token-expiration: 604800000  # 7 days
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:your_stripe_secret_key}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:your_stripe_webhook_secret}
    price-pro: ${STRIPE_PRICE_PRO:your_stripe_price_id_pro}
    price-enterprise: ${STRIPE_PRICE_ENTERPRISE:your_stripe_price_id_enterprise}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/subscription/success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/subscription/cancel}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:your_twilio_account_sid}
    auth-token: ${TWILIO_AUTH_TOKEN:your_twilio_auth_token}
    from-number: ${TWILIO_FROM_NUMBER:your_twilio_from_number}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
